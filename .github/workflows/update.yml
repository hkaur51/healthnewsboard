name: Update desk

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (UTC). GitHub can delay scheduled runs by a few minutes.
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    paths:
      - sources.json
      - scripts/fetch.py

permissions:
  contents: write

concurrency:
  group: update-desk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch sources
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional; leave unset to skip AI angles
          ANGLE_PERSPECTIVE: ${{ vars.ANGLE_PERSPECTIVE }}
        run: python scripts/fetch.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/items.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json
          git commit -m "Update desk $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push
